# ============================================================================
# dsh-lit-translate —— DSH bundle patch
# ============================================================================
# 把「文献翻译」面板挂进 Web profile 的配置树。
#
# 安装：
#   dsh plugin --profile <你的 web profile> add link:<本目录的绝对路径>
#   或先打包再装：dsh plugin --profile web add file:<tgz 路径>
#
# 依赖说明：翻译走 harness 当前的默认模型（ctx.get('llm') + agentDefaultModel），
# 不额外配置 API Key；没有可用默认模型时面板仍能打开，只是翻译会报错。
#
# 本机 DSH 运行时未附带 TypeScript 编译器，插件以纯 ESM JavaScript 交付，
# 入口是 lib/index.js，无需构建步骤。
# ============================================================================

- insert:
    - id: dsh-lit-translate
      name: dsh-lit-translate
      config:
        # 单次翻译的原文上限（字符）。超过就让用户/模型先切段，避免一次塞爆上下文。
        maxChars: 120000
        # lit_translate 在调用方没写 annotate 时的默认值。
        # true = 术语首次出现写成「中文（English）」；false = 纯中文译文。
        annotate: true
        # 工作稿（原文 + 各段译文）的落盘目录。
        # 留空/null 则用 $DSH_HOME/lit-translate。
        dataDir: null

        # ---- MeSH 2026 术语约束（随包分发的离线索引，data/mesh_index.bin）----
        # true = 翻译前把原文命中的 MeSH 术语（规范英文名 + 释义 + MeSH 编号）
        # 作为术语约束注入系统提示词，减少同一术语前后译法不一致。
        # 注意：MeSH 只有英文、没有中文名；这一层不产出任何中文译名。
        # 索引缺失/损坏时自动降级为纯翻译，只在工具输出与面板上给出警告。
        mesh: true
        # 索引文件路径。留空/null = 插件自带的 data/mesh_index.bin（74 MiB，355,232 条记录）。
        meshIndexFile: null
        # 单次最多注入多少个术语（命中更多时按词长与特异性优先）
        meshMaxTerms: 40
        # 每个术语的释义截断到多少字符
        meshDefChars: 120
        # 术语块总长度上限（字符），防止提示词被术语表吃掉
        meshMaxBlockChars: 3600
